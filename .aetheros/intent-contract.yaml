schema_version: 1.0.0
status: approved
project_id: aether-radio-sim
intent: >-
  将该项目接入 AetherOS 自主研发模式，用于后续无线电/通信仿真相关研发。
  第一研发里程碑 M1：Governed ops scrape stack evidence pack
  （prom-serve + Prometheus + Grafana + reproducible ops evidence 闭环）。
target_users:
  - AetherOS R&D operators (Cursor harness)
  - Radio/communication simulation developers
scope:
  - Govern aether-radio-sim under AetherOS autonomous R&D
  - M1: reproducible ops evidence loop (prom-serve + Prometheus + Grafana)
  - Authorized after this promotion: trusted context, architecture planning, verification planning
non_goals:
  - Do not authorize business/source crate implementation in this promotion
  - Do not enter implementation gate
  - Do not make CUDA / DPDK / FPGA / real hardware a current gate condition
  - Do not self-approve completed_gate_ids or mutate state_version
constraints:
  - Program/data decoupling: policies stay in configs/ and data/
  - Interface → test → mock → backend; no hardware sockets in business crates
  - Autonomy remains L1 until smoke/capability promotion
  - M1 must not depend on CUDA, DPDK, FPGA, or real hardware
  - Promotion authorization is limited to context / architecture / verification planning
success_metrics:
  - Intent contract status is approved with explicit authorization boundary
  - M1 milestone recorded and confirmed
  - Special hardware classified as optional_cuda_wsl2 without blocking M1
  - Pending intake decisions cleared; ready for /aetheros-continue
  - No business code changes in this confirmation pass
kpi_candidates:
