[package]
name = "aether-radio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entrypoint for Aether Radio simulation control plane"

[[bin]]
name = "aether-radio-sim"
path = "src/main.rs"

[features]
default = []
cuda = ["gpu-cuda/cuda", "benchmark/cuda"]

[dependencies]
aether-types = { workspace = true }
aether-protocol = { workspace = true }
aether-transport = { workspace = true }
fpga-emulator = { workspace = true }
ethernet-model = { workspace = true }
cx5-emulator = { workspace = true }
memory-manager = { workspace = true }
gpu-runtime = { workspace = true }
gpu-cuda = { workspace = true }
net-io = { workspace = true }
shm-io = { workspace = true }
metrics-engine = { workspace = true }
fault-injection = { workspace = true }
benchmark = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
