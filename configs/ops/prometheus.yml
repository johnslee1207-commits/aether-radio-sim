# Sample Prometheus scrape config for local aether-radio-sim ops.
# Start exporter: cargo run -p aether-radio-cli -- prom-serve
# Then: prometheus --config.file=configs/ops/prometheus.yml
#
# classification: local_machine_specific (ports / job names)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aether-sim
    static_configs:
      - targets: ["127.0.0.1:9898"]
    metrics_path: /metrics
    scrape_interval: 5s
