version: "1.0.0"
id: ops-observability-default
classification: project_specific
description: Default observability plane policy (simulation)
metrics:
  enabled: true
  export_json: true
  export_prometheus_text: true
  snapshot_interval_ms: 1000
logging:
  default_level: INFO
  structured_jsonl: true
  events_path: data/reports/ops_events.jsonl
  elevate_on_degraded: true
  elevated_level: DEBUG
trace:
  enabled: true
  ring_capacity: 4096
  export_path: data/reports/traces/packet_traces.jsonl
  stages:
    - FPGA_TX
    - WIRE_DEPART
    - CX5_RX
    - DMA_DONE
    - HOST_READY
    - GPU_ENQUEUE
    - CUDA_START
    - CUDA_DONE
health:
  policy_path: configs/ops/health_policy.yaml
recovery:
  policy_path: configs/ops/recovery_policy.yaml
prometheus_scrape:
  config_path: configs/ops/prometheus_scrape.yaml
dashboard:
  enabled: false
  grafana_dir: data/ops/dashboards
