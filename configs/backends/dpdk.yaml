version: "1.0.0"
id: dpdk-backend-mock
classification: external_integration_specific
description: >
  DPDK PacketIO contract. Business crates never link libdpdk.
  backend=mock simulates mbuf/burst queues; backend=hardware remains unavailable
  until a dedicated adapter crate is enabled.
backend: mock
enabled: true
pci_address: "0000:00:00.0"
rx_queues: 1
tx_queues: 1
mbuf_pool_size: 1024
burst_size: 32
poll_cost_ns: 50
hugepage_mb: 0
notes: Prefer SimPacketIO for unit tests; use mock for DPDK-shaped integration.
